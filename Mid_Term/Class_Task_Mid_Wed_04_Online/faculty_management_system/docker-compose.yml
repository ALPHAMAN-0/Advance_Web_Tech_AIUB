services:
  postgres:
    image: postgres:17-alpine
    container_name: faculty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: faculty_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faculty_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: